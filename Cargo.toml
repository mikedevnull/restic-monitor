[package]
name = "restic-monitor"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[lib]
name = "restic_monitor"
path = "src/lib.rs"

[[bin]]
name = "restic-monitor"
path = "src/main.rs"

[dependencies]
actix-files = "0.7.2"
actix-http = "3.20.0"
actix-web = "4.18.1"
aes-gcm = { version = "0.11.1", features = ["rand_core"] }
argon2 = "0.6.0"
axum-test = { version = "21.1.0", features = ["actix-web"] }
base64 = "0.23.1"
env_logger = "0.11.11"
future-utils = "0.12.1"
rand = "0.10.4"
rustic_backend = "0.8.0"
rustic_core = "0.13.0"
scraper = "0.29.0"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["json", "runtime-tokio", "sqlite"] }
tera = { version = "2.4.0", features = ["glob_fs"] }
thiserror = "2.0.21"
tracing-subscriber = "0.3.23"
