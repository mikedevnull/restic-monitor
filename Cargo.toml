[package]
name = "restic-monitor"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[lib]
name = "restic_monitor"
path = "src/lib.rs"

[[bin]]
name = "restic-monitor"
path = "src/main.rs"

[dependencies]
actix-files = "0.7.2"
actix-web = "4.18.1"
env_logger = "0.11.11"
rustic_backend = "0.7.0"
rustic_core = "0.13.0"
tera = { version = "2.4.0", features = ["glob_fs"] }
