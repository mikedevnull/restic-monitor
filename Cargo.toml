[package]
name = "restic-monitor"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[workspace]
members = [".", "migration"]

[lib]
name = "restic_monitor"
path = "src/lib.rs"

[[bin]]
name = "restic-monitor"
path = "src/main.rs"

[dependencies]
actix-files = "0.7.2"
actix-http = "3.20.0"
actix-web = "4.18.1"
argon2 = "0.6.0"
axum-test = { version = "21.1.0", features = ["actix-web"] }
env_logger = "0.11.11"
future-utils = "0.12.1"
migration = { path = "migration" }
rustic_backend = "0.7.0"
rustic_core = "0.13.0"
scraper = "0.29.0"
sea-orm = { version = "2.0.4", features = [
    "sqlx-sqlite",
    "macros",
    "debug-print",
] }
serde = { version = "1.0.229", features = ["derive"] }
tera = { version = "2.4.0", features = ["glob_fs"] }
thiserror = "2.0.21"
tracing-subscriber = "0.3.23"
